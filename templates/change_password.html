{% extends 'base.html' %}
{% block title %}Change Password - Face Recognition Attendance{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="glass-panel">
            <h1 class="h3 page-title mb-1">Change Password</h1>
            <p class="small text-secondary mb-4">Use at least {{ min_password }} characters.</p>
            <form action="{{ url_for('change_password') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label" for="current_password">Current password</label>
                    <input type="password" name="current_password" id="current_password" class="form-control bg-dark text-light border-secondary" autocomplete="current-password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="new_password">New password</label>
                    <input type="password" name="new_password" id="new_password" class="form-control bg-dark text-light border-secondary" minlength="{{ min_password }}" autocomplete="new-password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="confirm_password">Confirm new password</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control bg-dark text-light border-secondary" minlength="{{ min_password }}" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn-custom mb-0">Change Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
