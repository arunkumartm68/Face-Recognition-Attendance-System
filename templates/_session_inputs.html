<div class="row g-2 mb-3">
    <div class="col-6">
        <label class="form-label text-secondary mb-1 small" for="scanDuration">Class length (min)</label>
        <input type="number" id="scanDuration" class="form-control bg-dark text-light border-secondary" min="0" max="600" step="1" value="60">
    </div>
    <div class="col-6">
        <label class="form-label text-secondary mb-1 small" for="scanLateAfter">Late after (min)</label>
        <input type="number" id="scanLateAfter" class="form-control bg-dark text-light border-secondary" min="0" max="600" step="1" value="10">
    </div>
    <div class="col-12 form-text text-secondary">
        The scanner closes itself when the class is over; students recognised after the late time are marked Late. Use 0 to turn either off.
    </div>
</div>
